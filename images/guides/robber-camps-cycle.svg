</g>
<g fill="none" stroke="#d5b974" stroke-width="3" marker-end="url(#arrow)"><path d="M252 91H288"/><path d="M538 91H574"/><path d="M824 91H860"/><path d="M991 223Q991 252 552 252T130 223"/></g>
</svg>