  <text x="120" y="184" text-anchor="middle" fill="#f2e6be" font-family="Arial" font-size="15" font-weight="bold">Ramp up: burning</text>
</g>
<g transform="translate(582 12)">
  <use href="#tile" width="240" height="160"/>
  <path d="M120 10 233 80 120 151 7 80Z" fill="url(#darkTile)" stroke="#a5ab8f" stroke-width="2"/>
  <path d="M66 119 104 64 139 119Z" fill="#96744a" stroke="#1e1c22" stroke-width="4"/><path d="M93 119 110 91 125 119" fill="#251e22"/>
  <path d="M142 98 174 55 208 98Z" fill="#aa7a56" stroke="#261f24" stroke-width="4"/>
  <path d="M161 97V70" stroke="#eed7a3" stroke-width="3"/><path d="M161 70l25 11-25 4" fill="#9c384b"/>
  <path d="M88 64V44m80 6V35" stroke="#41382c" stroke-width="5"/>
