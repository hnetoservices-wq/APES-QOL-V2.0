name: Strip source comments

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  strip-comments:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install parser tools
        run: |
          mkdir -p /tmp/apes-strip
          cd /tmp/apes-strip
          npm init -y >/dev/null 2>&1
          npm install --silent @babel/parser @babel/generator postcss postcss-discard-comments
      - name: Strip comments and validate
        run: |
          NODE_PATH=/tmp/apes-strip/node_modules node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const parser = require('@babel/parser');
          const generator = require('@babel/generator').default;
          const postcss = require('postcss');
          const discardComments = require('postcss-discard-comments');

          const root = process.cwd();
          const skipped = new Set(['.git', 'node_modules']);
          const jsPlugins = [
            'jsx',
            'classProperties',
            'classPrivateProperties',
            'classPrivateMethods',
            'dynamicImport',
            'importMeta',
            'optionalChaining',
            'nullishCoalescingOperator',
            'numericSeparator',
            'topLevelAwait',
            'logicalAssignment',
            'objectRestSpread',
            'optionalCatchBinding',
            'asyncGenerators',
            'bigInt'
          ];

          function walk(dir, files = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (skipped.has(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, files);
              else files.push(full);
            }
            return files;
          }

          function parseJs(source, filename) {
            return parser.parse(source, {
              sourceType: 'unambiguous',
              sourceFilename: filename,
              allowReturnOutsideFunction: true,
              allowAwaitOutsideFunction: true,
              plugins: jsPlugins
            });
          }

          async function main() {
            const files = walk(root);
            let changed = 0;
            let jsCount = 0;
            let cssCount = 0;
            let markupCount = 0;

            for (const file of files) {
              const relative = path.relative(root, file).replaceAll('\\', '/');
              const ext = path.extname(file).toLowerCase();
              const original = fs.readFileSync(file, 'utf8');
              let output = original;

              if (ext === '.js') {
                const ast = parseJs(original, relative);
                output = generator(ast, {
                  comments: false,
                  compact: false,
                  concise: false,
                  retainLines: false,
                  jsescOption: { minimal: true }
                }, original).code + '\n';
                const verify = parseJs(output, relative);
                if (Array.isArray(verify.comments) && verify.comments.length) {
                  throw new Error(`Comments remain in ${relative}`);
                }
                jsCount += 1;
              } else if (ext === '.css') {
                const result = await postcss([
                  discardComments({ removeAll: true })
                ]).process(original, { from: undefined });
                output = result.css
                  .split('\n')
                  .map(line => line.replace(/[ \t]+$/g, ''))
                  .join('\n');
                const rootCss = postcss.parse(output);
                let remaining = 0;
                rootCss.walkComments(() => { remaining += 1; });
                if (remaining) throw new Error(`Comments remain in ${relative}`);
                if (!output.endsWith('\n')) output += '\n';
                cssCount += 1;
              } else if (ext === '.html' || ext === '.htm' || ext === '.svg') {
                output = original.replace(/<!--[\s\S]*?-->/g, '');
                if (!output.endsWith('\n')) output += '\n';
                markupCount += 1;
              } else {
                continue;
              }

              if (output !== original) {
                fs.writeFileSync(file, output);
                changed += 1;
              }
            }

            const manifestPath = path.join(root, 'manifest.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest.version = '2.0.0.72';
            manifest.version_name = '2.0.0-alpha.79';
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

            console.log(`Processed ${jsCount} JS, ${cssCount} CSS and ${markupCount} markup files; changed ${changed} source files.`);
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js css manifest.json
          git commit -m "Strip source comments and bump alpha.79"
          git push
