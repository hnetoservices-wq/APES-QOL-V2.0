name: Apply Oasis Scanner Final
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 .github/scripts/apply_oasis_final.py
          node --check js/features/oasisScanner.js
          git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/features/oasisScanner.js manifest.json
          git commit -m "Refine Oasis Scanner visible sections"
          git push
