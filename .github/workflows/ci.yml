name: APES extension checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: extension-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension-checks:
    name: Extension checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out proposed code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate manifest references and source syntax
        run: node tools/validate-extension.mjs

  regression-suite:
    name: Regression suite (advisory — baseline failures)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Existing tests fail on the pre-existing main and release/2.0.192 bases.
    # Keep running and reporting them, but do not block all contributions until
    # the baseline failures are fixed in separate feature/test PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install test dependencies
        run: npm ci --prefix tests --ignore-scripts
      - name: Run complete existing test suite
        run: npm test --prefix tests
