name: Watchlist regression tests

on:
  pull_request:
    paths:
      - 'js/features/watchlist.js'
      - 'js/modules/watchlist/**'
      - 'css/features/watchlistIntelligence.css'
      - 'js/locales/catalogs.js'
      - 'tools/translations.tsv'
      - 'tests/watchlist.cjs'
      - 'tests/watchlistIntelligence.cjs'
      - 'tests/watchlistSavedReports.cjs'
      - 'js/features/reportArchive.js'
      - 'tests/package*.json'
      - '.github/workflows/watchlist.yml'
  push:
    branches:
      - 'feature/watchlist-*'

jobs:
  watchlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install test dependencies
        run: npm ci --prefix tests
      - name: Run Watchlist regression tests
        run: |
          node tests/watchlist.cjs
          node tests/watchlistIntelligence.cjs
          node tests/watchlistSavedReports.cjs
      - name: Check localization and Oasis Sniper integration
        run: |
          node tests/languageSelectorVisibility.cjs
          node tests/localization.cjs
          node tests/oasisSniperChecker.cjs
          node tests/oasisSniperLayout.cjs
      - name: Verify localized extension and message catalog
        run: |
          node tests/featureLocalization.cjs
          node tools/audit-feature-localization.cjs
