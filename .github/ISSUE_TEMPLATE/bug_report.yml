name: Bug report
description: Report a reproducible APES QoL malfunction (not a security vulnerability)
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Please search existing reports first. Remove account IDs, names, tokens and personal information from logs or screenshots. Report security issues privately as described in SECURITY.md."
  - type: input
    id: feature
    attributes:
      label: Affected APES tool
      placeholder: e.g. Smithy Calculator or Watchlist
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: APES version or Git branch
      placeholder: e.g. 2.0.192 / release/2.0.192
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 158
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Specify server speed or relevant gameplay context without identifying your account.
      placeholder: "1. Open ...\n2. Click ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized screenshots or console output
      description: Never include credentials, session cookies, player names or private reports.
    validations:
      required: false
